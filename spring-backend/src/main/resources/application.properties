# Server — Railway/Render inject PORT automatically
server.port=${PORT:8080}

# AI provider — ALL values must be set via environment variables on the server
# NEVER commit real keys here
ai.api-key=${CODECRAFT_API_KEY}
                ai.base-url=${CODECRAFT_BASE_URL:https://codecraftapi.com/v1}
ai.model=${CODECRAFT_MODEL:claude-opus-5}

# CORS — allow Chrome extension service workers (chrome-extension://*) plus any extra origins
# Override via CORS_ALLOWED_ORIGIN env var on the server if needed
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:chrome-extension://*}

# Multipart limits (screenshots can be large)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=info 


